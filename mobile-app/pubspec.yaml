name: food_recognition_app
description: "AI-based food recognition and nutrition estimation app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http_parser: ^4.0.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Camera / image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Networking
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # On-device inference
  tflite_flutter: ^0.12.0
  image: ^4.2.0

  # Charts & progress indicators
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Screenshot & sharing
  screenshot: ^3.0.0
  share_plus: ^10.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Gemini AI (Flutter-side)

  # File export
  path_provider: ^2.1.4

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2

  # Connectivity
  connectivity_plus: ^6.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/food_model.tflite
    - assets/class_names_filtered.json
    - assets/images/
    - assets/nutrition_model.tflite
    - assets/vectorizer.json
    - assets/scaler.json
